name: Build Diagnostic Linux x64

on:
  push:
    branches:
      - main
      - fix/live-dash-period-handoff
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux-x64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.300"

      - name: Apply live resilience changes
        run: |
          python scripts/run-live-resilience-manager-only.py
          python scripts/run-live-init-alias-patch.py

      - name: Install LLVM linker
        run: |
          sudo apt-get update
          sudo apt-get install -y lld

      - name: Restore NuGet packages
        run: dotnet restore src/N_m3u8DL-RE.Tests/N_m3u8DL-RE.Tests.csproj -r linux-musl-x64

      - name: Run tests
        run: dotnet test src/N_m3u8DL-RE.Tests/N_m3u8DL-RE.Tests.csproj -c Release --no-restore

      - name: Build Linux x64
        run: |
          dotnet publish src/N_m3u8DL-RE -r linux-musl-x64 -c Release -o artifact -p:LinkerFlavor=lld --no-restore

      - name: Verify binary
        run: |
          test -x artifact/N_m3u8DL-RE
          file artifact/N_m3u8DL-RE
          artifact/N_m3u8DL-RE --help >/tmp/help.txt
          head -40 /tmp/help.txt

      - name: Package
        run: |
          tar -czf N_m3u8DL-RE-diagnostic-linux-x64.tar.gz -C artifact N_m3u8DL-RE

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: N_m3u8DL-RE-diagnostic-linux-x64
          path: N_m3u8DL-RE-diagnostic-linux-x64.tar.gz

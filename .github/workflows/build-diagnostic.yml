name: Build Diagnostic Linux x64

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux-x64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch live DASH Period handoff
        shell: python
        run: |
          from pathlib import Path
          import subprocess

          path = Path("src/N_m3u8DL-RE.Parser/Extractor/DASHExtractor2.cs")
          text = path.read_text(encoding="utf-8-sig")
          changed = False

          old_index = '                    var _index = streamList.FindIndex(_f => _f.PeriodId != streamSpec.PeriodId && _f.GroupId == streamSpec.GroupId && _f.Resolution == streamSpec.Resolution && _f.MediaType == streamSpec.MediaType);'
          new_index = '''                    var _index = streamList.FindIndex(_f =>\n                        _f.PeriodId != streamSpec.PeriodId &&\n                        _f.MediaType == streamSpec.MediaType &&\n                        _f.Resolution == streamSpec.Resolution &&\n                        (_f.GroupId == streamSpec.GroupId || (isLive && IsSameLogicalLiveTrack(_f, streamSpec))));'''
          if old_index in text:
              text = text.replace(old_index, new_index, 1)
              changed = True

          old_live = '''                        if (isLive)\n                        {\n                            // 直播，这种情况直接略过新的\n                        }'''
          new_live = '''                        if (isLive)\n                        {\n                            // Live MPDs can overlap Periods at ad/content boundaries.\n                            // Prefer the newest Period so auto-selection and refreshes follow\n                            // the active timeline instead of retaining the stale Period.\n                            Logger.Debug($"[StreamRelay] Prefer newest live DASH Period for {streamSpec.GroupId} ({streamSpec.MediaType}, {streamSpec.Resolution})");\n                            streamList[_index] = streamSpec;\n                        }'''
          if old_live in text:
              text = text.replace(old_live, new_live, 1)
              changed = True

          if changed:
              path.write_text(text, encoding="utf-8")
              subprocess.run(["git", "config", "user.name", "github-actions[bot]"], check=True)
              subprocess.run(["git", "config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com"], check=True)
              subprocess.run(["git", "add", str(path)], check=True)
              subprocess.run(["git", "commit", "-m", "Prefer newest live DASH Period"], check=True)
              subprocess.run(["git", "push"], check=True)
          else:
              print("Live DASH Period deduplication patch already applied; continuing with rebuild.")

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.300"

      - name: Install LLVM linker
        run: |
          sudo apt-get update
          sudo apt-get install -y lld

      - name: Build Linux x64
        run: |
          dotnet publish src/N_m3u8DL-RE -r linux-musl-x64 -c Release -o artifact -p:LinkerFlavor=lld

      - name: Verify binary
        run: |
          test -x artifact/N_m3u8DL-RE
          file artifact/N_m3u8DL-RE
          artifact/N_m3u8DL-RE --help >/tmp/help.txt
          head -40 /tmp/help.txt

      - name: Package
        run: |
          tar -czf N_m3u8DL-RE-diagnostic-linux-x64.tar.gz -C artifact N_m3u8DL-RE

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: N_m3u8DL-RE-diagnostic-linux-x64
          path: N_m3u8DL-RE-diagnostic-linux-x64.tar.gz

name: Build Diagnostic Linux x64

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux-x64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch live DASH Period handoff
        shell: python
        run: |
          from pathlib import Path
          import subprocess

          path = Path("src/N_m3u8DL-RE.Parser/Extractor/DASHExtractor2.cs")
          text = path.read_text(encoding="utf-8-sig")

          changed = False

          old_live = '''                    if (isLive)\n                    {\n                        // 直播，这种情况直接略过新的\n                    }\n                    else'''
          new_live = '''                    if (isLive)\n                    {\n                        // Live MPDs can overlap Periods at ad/content boundaries.\n                        // Prefer the newest Period so refreshes follow the active timeline.\n                        Logger.Debug($"[StreamRelay] Prefer newest live DASH Period for {streamSpec.GroupId} ({streamSpec.MediaType}, {streamSpec.Resolution})");\n                        streamList[_index] = streamSpec;\n                    }\n                    else'''
          if old_live in text:
              text = text.replace(old_live, new_live, 1)
              changed = True

          helper = '''\n    private static bool IsSameLogicalLiveTrack(StreamSpec left, StreamSpec right)\n    {\n        if (left.MediaType != right.MediaType) return false;\n        if (!string.Equals(left.Resolution, right.Resolution, StringComparison.Ordinal)) return false;\n        if (!string.Equals(left.Language, right.Language, StringComparison.OrdinalIgnoreCase)) return false;\n        if (left.Role != right.Role) return false;\n        if (!string.Equals(left.Codecs, right.Codecs, StringComparison.OrdinalIgnoreCase)) return false;\n        if (left.MediaType == MediaType.VIDEO && left.FrameRate.HasValue && right.FrameRate.HasValue && Math.Abs(left.FrameRate.Value - right.FrameRate.Value) > 0.01) return false;\n        return true;\n    }\n'''

          if "private static bool IsSameLogicalLiveTrack" not in text:
              anchor = "    private string? FilterLanguage(string? v)"
              if anchor not in text:
                  raise SystemExit("Could not find DASHExtractor2 helper insertion point")
              text = text.replace(anchor, helper + "\n" + anchor, 1)
              changed = True

          old_refresh = '''            if (!match.Any())\n                match = newStreams.Where(n => n.Playlist?.MediaInit?.Url == streamSpec.Playlist?.MediaInit?.Url);\n\n            if (match.Any())\n                streamSpec.Playlist!.MediaParts = match.First().Playlist!.MediaParts; // 不更新init'''
          new_refresh = '''            if (!match.Any())\n                match = newStreams.Where(n => n.Playlist?.MediaInit?.Url == streamSpec.Playlist?.MediaInit?.Url);\n\n            // At a live Period boundary the representation ID/init URL may change even\n            // though this is the same logical audio/video track. Match by stable track\n            // properties and use the newest Period selected by ExtractStreamsAsync.\n            if (!match.Any() && streamSpec.Playlist?.IsLive == true)\n                match = newStreams.Where(n => IsSameLogicalLiveTrack(streamSpec, n));\n\n            if (match.Any())\n            {\n                var matched = match.Last();\n                streamSpec.PeriodId = matched.PeriodId;\n                streamSpec.Playlist!.MediaInit = matched.Playlist!.MediaInit;\n                streamSpec.Playlist.MediaParts = matched.Playlist.MediaParts;\n            }'''
          if old_refresh in text:
              text = text.replace(old_refresh, new_refresh, 1)
              changed = True

          if changed:
              path.write_text(text, encoding="utf-8")
              subprocess.run(["git", "config", "user.name", "github-actions[bot]"], check=True)
              subprocess.run(["git", "config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com"], check=True)
              subprocess.run(["git", "add", str(path)], check=True)
              subprocess.run(["git", "commit", "-m", "Fix live DASH Period handoff"], check=True)
              subprocess.run(["git", "push"], check=True)
          else:
              print("Live DASH Period patch already applied; continuing with rebuild.")

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.300"

      - name: Install LLVM linker
        run: |
          sudo apt-get update
          sudo apt-get install -y lld

      - name: Build Linux x64
        run: |
          dotnet publish src/N_m3u8DL-RE -r linux-musl-x64 -c Release -o artifact -p:LinkerFlavor=lld

      - name: Verify binary
        run: |
          test -x artifact/N_m3u8DL-RE
          file artifact/N_m3u8DL-RE
          artifact/N_m3u8DL-RE --help >/tmp/help.txt
          head -40 /tmp/help.txt

      - name: Package
        run: |
          tar -czf N_m3u8DL-RE-diagnostic-linux-x64.tar.gz -C artifact N_m3u8DL-RE

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: N_m3u8DL-RE-diagnostic-linux-x64
          path: N_m3u8DL-RE-diagnostic-linux-x64.tar.gz

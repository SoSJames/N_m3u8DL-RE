name: native-pipe-build

on:
  push:
    branches:
      - test-stream-pipe-x9k3
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build
        run: dotnet build src/N_m3u8DL-RE.sln -c Release
      - name: Test
        run: dotnet test src/N_m3u8DL-RE.sln -c Release --no-build

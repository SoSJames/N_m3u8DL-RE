name: native-pipe-build

on:
  push:
    branches:
      - test-stream-pipe-x9k3
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current branch HEAD
        uses: actions/checkout@v4
        with:
          ref: test-stream-pipe-x9k3
          fetch-depth: 0

      - name: Verify checked out revision
        run: |
          echo "GITHUB_SHA=$GITHUB_SHA"
          echo "Checked-out HEAD=$(git rev-parse HEAD)"
          git log -1 --oneline

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build src/N_m3u8DL-RE.sln -c Release

      - name: Test
        run: dotnet test src/N_m3u8DL-RE.sln -c Release --no-build

      - name: Publish Linux x64 self-contained binary
        run: |
          dotnet publish src/N_m3u8DL-RE/N_m3u8DL-RE.csproj \
            -c Release \
            -r linux-x64 \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:PublishTrimmed=true \
            -p:PublishAot=false \
            -o artifacts/N_m3u8DL-RE-linux-x64
          test -s artifacts/N_m3u8DL-RE-linux-x64/N_m3u8DL-RE
          chmod +x artifacts/N_m3u8DL-RE-linux-x64/N_m3u8DL-RE
          ./artifacts/N_m3u8DL-RE-linux-x64/N_m3u8DL-RE --help >/dev/null
          printf '%s\n' "Built commit: $(git rev-parse HEAD)" > artifacts/N_m3u8DL-RE-linux-x64/BUILD_COMMIT.txt
          printf '%s\n' "$(git rev-parse HEAD)"

      - name: Upload Linux x64 native-pipe package
        uses: actions/upload-artifact@v4
        with:
          name: N_m3u8DL-RE-linux-x64-native-pipe
          path: artifacts/N_m3u8DL-RE-linux-x64/
          if-no-files-found: error
          retention-days: 30

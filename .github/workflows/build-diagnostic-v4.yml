name: Build Diagnostic Linux + Windows x64 v4

on:
  push:
    branches:
      - experiment/shaka-live-packager
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_VERSION: 10.0.300

jobs:
  build-linux-x64-v4:
    runs-on: ubuntu-latest
    env:
      RID: linux-musl-x64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: experiment/shaka-live-packager

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Apply live resilience v4
        run: |
          python scripts/run-live-resilience-v4.py
          python scripts/run-live-init-alias-patch.py

      - name: Install LLVM linker
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update
          sudo apt-get install -y lld

      - name: Restore NuGet packages
        run: dotnet restore src/N_m3u8DL-RE.Tests/N_m3u8DL-RE.Tests.csproj -r ${{ env.RID }}

      - name: Run tests
        run: dotnet test src/N_m3u8DL-RE.Tests/N_m3u8DL-RE.Tests.csproj -c Release --no-restore

      - name: Build Linux x64
        run: dotnet publish src/N_m3u8DL-RE -r ${{ env.RID }} -c Release -o artifact-linux -p:LinkerFlavor=lld --no-restore

      - name: Verify Linux binary
        run: |
          test -x artifact-linux/N_m3u8DL-RE
          file artifact-linux/N_m3u8DL-RE
          artifact-linux/N_m3u8DL-RE --help >/tmp/help-linux.txt
          head -40 /tmp/help-linux.txt

      - name: Package Linux binary
        run: tar -czf N_m3u8DL-RE-diagnostic-v4-linux-x64.tar.gz -C artifact-linux N_m3u8DL-RE

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: N_m3u8DL-RE-diagnostic-v4-linux-x64
          path: N_m3u8DL-RE-diagnostic-v4-linux-x64.tar.gz
          retention-days: 90

  build-windows-x64-v4:
    runs-on: windows-latest
    env:
      RID: win-x64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: experiment/shaka-live-packager

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Apply live resilience v4
        shell: pwsh
        run: |
          python scripts/run-live-resilience-v4.py
          python scripts/run-live-init-alias-patch.py

      - name: Restore NuGet packages
        shell: pwsh
        run: dotnet restore src/N_m3u8DL-RE.Tests/N_m3u8DL-RE.Tests.csproj -r $env:RID

      - name: Run tests
        shell: pwsh
        run: dotnet test src/N_m3u8DL-RE.Tests/N_m3u8DL-RE.Tests.csproj -c Release --no-restore

      - name: Build Windows x64 self-contained single-file
        shell: pwsh
        run: >-
          dotnet publish src/N_m3u8DL-RE
          -r $env:RID
          -c Release
          -o artifact-windows
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          -p:DebugSymbols=false
          --no-restore

      - name: Verify Windows binary
        shell: pwsh
        run: |
          if (-not (Test-Path artifact-windows/N_m3u8DL-RE.exe)) { throw 'Windows executable was not produced' }
          & artifact-windows/N_m3u8DL-RE.exe --help | Select-Object -First 40

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: N_m3u8DL-RE-diagnostic-v4-windows-x64
          path: artifact-windows/N_m3u8DL-RE.exe
          retention-days: 90
